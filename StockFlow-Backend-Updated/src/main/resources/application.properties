spring.application.name=backend


# Server
server.port=${PORT:8080}

# MySQL: local defaults, production values from environment
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/stockflow_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JSON
spring.jackson.serialization.indent-output=true

# JWT: configure JWT_SECRET in production
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=3600000

# CORS
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:4200}

# Logging
logging.level.org.springframework.security=WARN
